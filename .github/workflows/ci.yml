name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Test (incl. gate-invariant proptest + segment fuzzer)
        run: cargo test --workspace --release

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  python-sdk:
    name: python client (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Test (against in-process stub server)
        run: python -m pytest -q
        working-directory: clients/python

  fuzz:
    name: cargo-fuzz (segment parser, bounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the segment parser (bounded 60s)
        # Coverage-guided libFuzzer run; non-zero exit on any crash/OOM/timeout.
        run: cargo fuzz run segment_parse -- -max_total_time=60 -rss_limit_mb=4096

  typescript-sdk:
    name: typescript client (zero runtime deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test (tsc + node:test against in-process stub server)
        run: npm install --no-fund --no-audit && npm test
        working-directory: clients/typescript

  supply-chain:
    name: cargo-deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  security-suite:
    name: security assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Gate-invariant property test
        run: cargo test -p l5m-core --release --test gate_invariant_proptest
      - name: Adversarial gate + embedding bypass tests
        run: cargo test -p l5m-core --release --test adversarial_gates --test embeddings
      - name: Segment-parser fuzzer (20k mutations)
        run: cargo test -p l5m-core --release --lib open_never_panics_on_adversarial_bytes
      - name: Encryption-at-rest (sealed segments)
        run: cargo test -p l5m-core --release --features encryption --test encryption
      - name: Leak demo (exits non-zero if any gate leaks)
        run: cargo run -p l5m-core --release --example leak_demo
