apiVersion: v1
kind: Service
metadata:
  name: {{ include "l5m.fullname" . }}
  labels: {{- include "l5m.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector: {{- include "l5m.selectorLabels" . | nindent 4 }}
