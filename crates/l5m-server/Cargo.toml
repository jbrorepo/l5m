[package]
name = "l5m-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP server for L5M security-gated memory: JWT/JWKS auth, scoped keys, per-tenant metering, WAL durability."
readme = "README.md"
keywords = ["memory", "retrieval", "multi-tenant", "http", "security"]
categories = ["web-programming::http-server", "database-implementations"]

[dependencies]
l5m-core = { path = "../l5m-core", version = "0.1.0" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde.workspace = true
serde_json.workspace = true
jsonwebtoken = "9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
# JWKS tests generate throwaway RSA keys at runtime — no private-key material
# is ever committed to the repository.
rsa = "0.9"
rand = "0.8"
