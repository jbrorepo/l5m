[package]
name = "l5m-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) server exposing L5M security-gated memory to AI agents."
readme = "README.md"
keywords = ["mcp", "memory", "ai-agents", "retrieval", "security"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "l5m-mcp"
path = "src/main.rs"

[dependencies]
l5m-core = { path = "../l5m-core", version = "0.1.0" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
