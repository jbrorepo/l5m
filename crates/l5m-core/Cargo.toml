[package]
name = "l5m-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Security-gated memory/retrieval engine: authorization gates (tenant/policy/trust/temporal) run before relevance scoring."
readme = "README.md"
keywords = ["memory", "retrieval", "multi-tenant", "rag", "security"]
categories = ["database-implementations", "data-structures"]

[dependencies]
blake3.workspace = true
chacha20poly1305 = { version = "0.10.1", optional = true }
getrandom = { version = "0.4.2", optional = true }
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
proptest = "1.11.0"

[features]
# Enterprise encryption-at-rest (sealed segments). Off by default so the OSS
# core keeps a minimal dependency tree.
encryption = ["dep:chacha20poly1305", "dep:getrandom"]
