# Supply-chain policy enforced in CI via `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on any security advisory affecting the dependency tree.
yanked = "deny"
ignore = [
    # Marvin attack (RSA decryption timing side channel), no fixed upstream
    # release yet. Scoped acceptance: `rsa` is a DEV-ONLY dependency of
    # l5m-server's JWKS tests, used solely to generate throwaway keypairs at
    # test runtime. It is not part of any shipped binary, and the server only
    # VERIFIES RS256 signatures (via jsonwebtoken/ring) — it never performs
    # RSA decryption with a long-lived private key.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Permissive-only license allowlist (matches L5M's MIT/Apache-2.0 dual license).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# A core value of L5M is a small, auditable dependency tree.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
